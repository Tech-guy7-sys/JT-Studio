appId: world.jtech.jtstudio
productName: JT Studio
directories:
  buildResources: build
  output: release
files:
  - index.html
  - README.md
  - package.json
  - desktop/**
  - assets/**
  - "*.css"
  - "*.js"
  - build/icons/jt-studio.png
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  icon: build/icons/jt-studio.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: zip
      arch:
        - x64
        - ia32
nsis:
  installerIcon: build/icons/jt-studio.ico
  uninstallerIcon: build/icons/jt-studio.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JT Studio
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icons/jt-studio.icns
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
linux:
  icon: build/icons/jt-studio.png
  category: AudioVideo
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
