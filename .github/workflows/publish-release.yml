name: Publish JT Studio release
on:
  push:
    paths:
      - release-trigger.txt
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.1.0)
        required: true
        default: v0.1.0
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choose version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(tr -d '[:space:]' < release-trigger.txt)"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Version must match vMAJOR.MINOR.PATCH"; exit 1; fi
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package source
        shell: bash
        run: |
          mkdir -p dist
          zip -j "dist/JT-Studio-${{ steps.meta.outputs.version }}-source.zip" index.html README.md package.json
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: JT Studio ${{ steps.meta.outputs.tag }} — Browser Workbench
          generate_release_notes: true
          files: |
            dist/JT-Studio-${{ steps.meta.outputs.version }}-source.zip
            dist/SHA256SUMS.txt
